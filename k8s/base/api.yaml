apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/ORGANIZACION/scrummate-api:develop # TODO (Ezequiel): organización real
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: scrummate-config }
            - secretRef: { name: scrummate-secret }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      # TODO (Ezequiel): Job de migraciones (bundle de EF) antes de actualizar la API.
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - port: 8080
