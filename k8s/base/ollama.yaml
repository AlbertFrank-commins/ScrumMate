apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-modelos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          volumeMounts:
            - { name: modelos, mountPath: /root/.ollama }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi }
          # TODO (Ezequiel): postStart o Job que ejecute "ollama pull qwen2.5:3b".
      volumes:
        - name: modelos
          persistentVolumeClaim: { claimName: ollama-modelos }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
