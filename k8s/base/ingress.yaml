apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrummate
spec:
  ingressClassName: nginx
  rules:
    - host: scrummate.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
