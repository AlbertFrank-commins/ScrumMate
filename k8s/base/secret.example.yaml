# Plantilla. El secreto real se crea con:
# kubectl -n scrummate create secret generic scrummate-secret \
#   --from-literal=POSTGRES_PASSWORD=... \
#   --from-literal=ConnectionStrings__Default="Host=postgres;Database=scrummate;Username=scrummate;Password=..." \
#   --from-literal=Jwt__Secret=...
apiVersion: v1
kind: Secret
metadata:
  name: scrummate-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: cambiar
  ConnectionStrings__Default: Host=postgres;Database=scrummate;Username=scrummate;Password=cambiar
  Jwt__Secret: cambiar-por-una-clave-larga
