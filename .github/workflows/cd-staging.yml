# Módulo C (Ezequiel). Cada merge a develop publica imágenes y despliega en staging (kind).
name: CD staging

on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
